<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Expiring Deployments Helm Chart">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a0ff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#7cf4ff" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="r1" cx="30%" cy="25%" r="75%">
      <stop offset="0" stop-color="#00a0ff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#050505" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="r2" cx="80%" cy="20%" r="75%">
      <stop offset="0" stop-color="#7cf4ff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#050505" />
  <rect width="1200" height="630" fill="url(#r1)" />
  <circle cx="980" cy="120" r="260" fill="url(#r2)" filter="url(#blur)" />
  <circle cx="260" cy="520" r="320" fill="#ffdf5d" opacity="0.06" filter="url(#blur)" />

  <g transform="translate(84 92)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#g1)" />
    <text x="86" y="44" fill="#ffffff" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44">
      Expiring Deployments
    </text>
    <text x="0" y="120" fill="rgba(255,255,255,0.86)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="30">
      Kubernetes preview cleanup via Helm
    </text>
    <text x="0" y="176" fill="rgba(255,255,255,0.68)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="24">
      Install once per cluster · Opt in via annotations · Start in dry-run
    </text>

    <g transform="translate(0 236)">
      <g>
        <circle cx="12" cy="12" r="6" fill="#7cf4ff" />
        <text x="34" y="18" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22">
          Deletes expired namespaces
        </text>
      </g>
      <g transform="translate(0 44)">
        <circle cx="12" cy="12" r="6" fill="#7cf4ff" />
        <text x="34" y="18" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22">
          Uninstalls expired Helm releases (via lease markers)
        </text>
      </g>
      <g transform="translate(0 88)">
        <circle cx="12" cy="12" r="6" fill="#7cf4ff" />
        <text x="34" y="18" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22">
          Protected namespaces + circuit breaker
        </text>
      </g>
    </g>
  </g>
</svg>
