{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "expiring-deployments.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "expiring-deployments.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
{{ toYaml .Values.serviceAccount.annotations | indent 4 }}
{{- end }}
