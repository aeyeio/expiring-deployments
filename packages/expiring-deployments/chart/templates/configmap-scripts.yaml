apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "expiring-deployments.fullname" . }}-scripts
  labels:
    app.kubernetes.io/name: {{ include "expiring-deployments.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    expiring-deployments.io/type: script
  annotations: {}
data:
  run.sh: |
    #!/bin/sh
    set -euo pipefail

    if ! command -v jq >/dev/null 2>&1; then
      log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $1"; }
      log "jq not found, installing (requires package manager in base image)..."
      if command -v apk >/dev/null 2>&1; then
        apk add --no-cache jq >/dev/null
      elif command -v apt-get >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y jq >/dev/null
      else
        log "jq installation failed: no supported package manager"; exit 1
      fi
    fi

    log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $1"; }

    DRY_RUN=${DRY_RUN:-true}
    FEATURES_NAMESPACES=${FEATURES_NAMESPACES:-true}
    FEATURES_HELM_RELEASES=${FEATURES_HELM_RELEASES:-true}
    MANAGED_NAMESPACE_REGEX=${MANAGED_NAMESPACE_REGEX:-""}
    MANAGED_NAMESPACE_LABELS=${MANAGED_NAMESPACE_LABELS:-"{}"}
    PROTECTED_NAMESPACES=${PROTECTED_NAMESPACES:-"kube-system,kube-public,default"}
    MAX_DELETIONS_PER_RUN=${MAX_DELETIONS_PER_RUN:-20}
    REQUIRE_OWNER_ANNOTATION=${REQUIRE_OWNER_ANNOTATION:-false}
    HELM_UNINSTALL_TIMEOUT=${HELM_UNINSTALL_TIMEOUT:-"5m"}
    HELM_UNINSTALL_WAIT=${HELM_UNINSTALL_WAIT:-true}

    ns_skip_protected() {
      ns="$1"
      echo "$PROTECTED_NAMESPACES" | tr ',' '\n' | grep -Fx "$ns" >/dev/null
    }

    is_expired() {
      meta_json="$1"
      now=$(date -u +%s)
      expires_at=$(echo "$meta_json" | jq -r '."expiring-deployments.io/expires-at" // empty')
      ttl_hours=$(echo "$meta_json" | jq -r '."expiring-deployments.io/ttl-hours" // empty')
      created_at=$(echo "$meta_json" | jq -r '."expiring-deployments.io/created-at" // empty')
      creation_ts=$(echo "$meta_json" | jq -r '.creationTimestamp // empty')

      if [ -n "$expires_at" ]; then
        exp_epoch=$(date -u -d "$expires_at" +%s 2>/dev/null || true)
        [ -n "$exp_epoch" ] && [ $now -gt $exp_epoch ]
        return
      fi

      base_time=""
      if [ -n "$created_at" ]; then
        base_time=$(date -u -d "$created_at" +%s 2>/dev/null || true)
      fi
      if [ -z "$base_time" ] && [ -n "$creation_ts" ]; then
        base_time=$(date -u -d "$creation_ts" +%s 2>/dev/null || true)
      fi
      if [ -z "$base_time" ] || [ -z "$ttl_hours" ]; then
        return 1
      fi
      exp_epoch=$(($base_time + ${ttl_hours%.*} * 3600))
      [ $now -gt $exp_epoch ]
    }

    managed_namespace() {
      ns="$1"
      if [ -n "$MANAGED_NAMESPACE_REGEX" ]; then
        echo "$ns" | grep -E "$MANAGED_NAMESPACE_REGEX" >/dev/null || return 1
      fi
      # label selection
      if [ "$MANAGED_NAMESPACE_LABELS" != "{}" ]; then
        selector=$(echo "$MANAGED_NAMESPACE_LABELS" | jq -r 'to_entries | map("\(.key)=\(.value)") | join(",")')
        kubectl get ns "$ns" -l "$selector" >/dev/null 2>&1 || return 1
      fi
      return 0
    }

    log "Starting expiring-deployments run (dryRun=$DRY_RUN)"

    deletions=0
    ns_to_delete=""

    if [ "$FEATURES_NAMESPACES" = "true" ]; then
      kubectl get ns -o json | jq -c '.items[]' | while read -r ns; do
        name=$(echo "$ns" | jq -r '.metadata.name')
        annotations=$(echo "$ns" | jq -c '.metadata.annotations // {}')
        enabled=$(echo "$annotations" | jq -r '."expiring-deployments.io/enabled" // "false"')
        [ "$enabled" = "true" ] || continue
        ns_skip_protected "$name" && { log "skip namespace=$name reason=protected"; continue; }
        managed_namespace "$name" || { log "skip namespace=$name reason=not-managed"; continue; }

        creation_ts=$(echo "$ns" | jq -r '.metadata.creationTimestamp')
        meta=$(echo "$annotations" | jq --arg creationTimestamp "$creation_ts" '{ "expiring-deployments.io/expires-at": ."expiring-deployments.io/expires-at", "expiring-deployments.io/ttl-hours": ."expiring-deployments.io/ttl-hours", "expiring-deployments.io/created-at": ."expiring-deployments.io/created-at", creationTimestamp: $creationTimestamp }')
        if is_expired "$meta"; then
          if [ "$DRY_RUN" = "true" ]; then
            log "would delete namespace=$name"
          else
            log "deleting namespace=$name"
            kubectl delete ns "$name" || log "error deleting namespace=$name"
          fi
          ns_to_delete="$ns_to_delete $name"
          deletions=$((deletions+1))
        else
          log "keep namespace=$name reason=not-expired"
        fi
        [ $deletions -ge $MAX_DELETIONS_PER_RUN ] && { log "circuit-breaker reached ($MAX_DELETIONS_PER_RUN)"; break; }
      done
    fi

    if [ "$FEATURES_HELM_RELEASES" = "true" ]; then
      selector="expiring-deployments.io/type=helm-release"
      kubectl get configmaps -A -l "$selector" -o json | jq -c '.items[]' | while read -r cm; do
        ns=$(echo "$cm" | jq -r '.metadata.namespace')
        name=$(echo "$cm" | jq -r '.metadata.name')
        release=$(echo "$cm" | jq -r '.metadata.labels."app.kubernetes.io/instance"')
        annotations=$(echo "$cm" | jq -c '.metadata.annotations // {}')
        enabled=$(echo "$annotations" | jq -r '."expiring-deployments.io/enabled" // "false"')
        [ "$enabled" = "true" ] || continue
        ns_skip_protected "$ns" && { log "skip cm=$name ns=$ns reason=protected"; continue; }
        managed_namespace "$ns" || { log "skip cm=$name ns=$ns reason=not-managed"; continue; }
        echo "$ns_to_delete" | tr ' ' '\n' | grep -Fx "$ns" >/dev/null && { log "skip cm=$name ns=$ns reason=namespace-deleting"; continue; }

        creation_ts=$(echo "$cm" | jq -r '.metadata.creationTimestamp')
        meta=$(echo "$annotations" | jq --arg creationTimestamp "$creation_ts" '{ "expiring-deployments.io/expires-at": ."expiring-deployments.io/expires-at", "expiring-deployments.io/ttl-hours": ."expiring-deployments.io/ttl-hours", "expiring-deployments.io/created-at": ."expiring-deployments.io/created-at", creationTimestamp: $creationTimestamp }')
        if is_expired "$meta"; then
          if [ "$REQUIRE_OWNER_ANNOTATION" = "true" ]; then
            owner=$(echo "$annotations" | jq -r '."expiring-deployments.io/owner" // empty')
            [ -z "$owner" ] && { log "skip cm=$name ns=$ns reason=missing-owner"; continue; }
          fi
          if [ "$DRY_RUN" = "true" ]; then
            log "would uninstall release=$release ns=$ns"
          else
            log "uninstalling release=$release ns=$ns"
            helm uninstall "$release" -n "$ns" --timeout "$HELM_UNINSTALL_TIMEOUT" {{- if .Values.helm.uninstallWait }} --wait {{- end }} || log "error uninstalling release=$release ns=$ns"
          fi
          deletions=$((deletions+1))
        else
          log "keep release=$release ns=$ns reason=not-expired"
        fi
        [ $deletions -ge $MAX_DELETIONS_PER_RUN ] && { log "circuit-breaker reached ($MAX_DELETIONS_PER_RUN)"; break; }
      done
    fi

    log "Run complete deletions_attempted=$deletions dryRun=$DRY_RUN"
